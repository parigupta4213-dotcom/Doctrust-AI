name: Build & Test CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            backend/package-lock.json

      - name: Install Client Dependencies & Build Frontend
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Install Backend Dependencies & Validate TypeScript
        working-directory: ./backend
        run: |
          npm ci
          npm run build
